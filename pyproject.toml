[project]
name = "yastation"
version = "0.1.0"
description = "Управление Яндекс Станцией с компьютера: TTS, команды Алисе, DSL от func_parser"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "func-parser @ git+https://github.com/denizsincar29/func_parser.git",
]

[project.scripts]
yastation = "yastation.__main__:run"
yastation-auth = "yastation.auth_qr:run"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "yastation"
